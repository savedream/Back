[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salyeodeurim-backend"
version = "1.3.0"
description = "살려드림 응급안내키트 백엔드"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
# PC에서 실제 모델(app/services/hf_model.py)을 돌릴 때만. 키트(NPU)는 키트용 실행기를 쓴다
model = [
    "torch>=2.9,<2.10",  # 2.9.0에서만 확인함(2.15는 macOS 14의 MPS(맥 GPU)에서 멈춤, 2.10~2.14는 확인 안 함)
    "transformers>=4.57",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
